[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinygen"
version = "0.1.0"
description = "Generate, evaluate, and refine Shiny apps using LLM agents in Docker sandboxes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karan Gathani" },
]
keywords = ["shiny", "llm", "code-generation", "evaluation", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1.3,<8.2.2",
    "inspect-ai",
    "inspect-swe>=0.2.63",
    "anthropic>=0.109.2",
    "openai>=2.42.0",
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/karangattu/shinygen"
Repository = "https://github.com/karangattu/shinygen"
"Bug Tracker" = "https://github.com/karangattu/shinygen/issues"

[project.optional-dependencies]
screenshot = [
    "playwright>=1.60.0",
]
dev = [
    "pytest>=9.1.0",
    "pyright>=1.1.410",
    "black>=26.5.1",
    "isort>=8.0.1",
    "playwright>=1.60.0",
]

[project.scripts]
shinygen = "shinygen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shinygen"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
